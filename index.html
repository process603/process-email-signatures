<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Email Signature Generator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f7f9;font-family:Arial,Helvetica,sans-serif;color:#24313a}
  .page{max-width:720px;margin:40px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #dfe6ea;border-radius:12px;padding:28px;box-shadow:0 4px 18px rgba(20,40,55,.06)}
  h1{font-size:20px;margin:0 0 6px}
  .help{font-size:13px;color:#66737c;margin:0 0 18px;line-height:1.5}
  .controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:260px}
  label{font-size:12px;font-weight:700;color:#4c5961}
  select{height:40px;border:1px solid #cfd9df;border-radius:7px;background:#fff;color:#24313a;padding:0 10px;font-size:14px;outline:none}
  select:focus{border-color:#6ba1c2;box-shadow:0 0 0 3px rgba(75,137,173,.12)}
  .preview{padding:18px;border:1px solid #e4eaee;border-radius:8px;background:#fff;overflow:auto;min-height:150px}
  .actions{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .copy{border:0;border-radius:7px;background:#2f709e;color:#fff;font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer}
  .copy:disabled{opacity:.5;cursor:not-allowed}
  .status{font-size:12px;color:#5e6b73}
  .error{font-size:13px;color:#9b2c2c;line-height:1.5}
  @media(max-width:520px){.page{margin:18px auto;padding:0 12px}.card{padding:18px}.preview{padding:12px}.field{min-width:100%;width:100%}}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <h1>Process Email Signature Generator</h1>
    <p class="help">Select a staff member, review the signature, then click <strong>Copy Signature</strong> and paste it into Gmail → Settings → General → Signature.</p>

    <div class="controls">
      <div class="field">
        <label for="staffSelect">Staff member</label>
        <select id="staffSelect" disabled><option>Loading staff…</option></select>
      </div>
    </div>

    <div class="preview">
      <div id="signature"></div>
      <div id="error" class="error" hidden></div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="copy" onclick="copySignature()" disabled>Copy Signature</button>
      <span id="status" class="status"></span>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'https://process603.github.io/process-card-assets/data.json';
const PROCESS_LOGO = 'https://raw.githubusercontent.com/process603/process-email-signatures/main/process-logo.png';
const KING_LOGO = 'https://raw.githubusercontent.com/process603/process-email-signatures/main/king-logo.png';
const FAX_DISPLAY = '603-386-6404';

let staffData = [];
let settings = {};

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function telHref(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.length===10) return 'tel:+1'+digits;
  if(digits.length===11 && digits.startsWith('1')) return 'tel:+'+digits;
  return 'tel:+'+digits;
}

function mapsHref(address){
  const a=String(address||'').trim();
  return a ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a) : '#';
}

function signatureHtml(person){
  const credentials = String(person.credentials || '').trim();
  const credentialHtml = credentials ? `, <span style="font-size:12px;">${esc(credentials)}</span>` : '';
  const website = settings.main_website || 'https://www.theprocessrecoverycenter.com/';
  const websiteDisplay = website.replace(/^https?:\/\//,'').replace(/\/$/,'');
  const location = person.location || settings.main_address || '21 Factory St, Nashua, NH 03060';
  const phoneHref = person.phoneHref || telHref(person.phone);
  const mapLink = mapsHref(location);

  return `
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:385px;max-width:385px;font-family:Arial,Helvetica,sans-serif;color:#26343d;">
<tr>
<td width="110" valign="middle" style="width:110px;padding:3px 9px 3px 0;text-align:center;border-right:1px solid #75a6c4;">
<a href="${esc(website)}" style="text-decoration:none;"><img src="${PROCESS_LOGO}" width="106" alt="The Process Recovery Center" style="display:block;width:106px;height:auto;border:0;margin:0 auto;"></a>
</td>
<td valign="top" style="padding:1px 0 1px 11px;">
<div style="font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:18px;font-weight:bold;font-style:italic;color:#1f2930;">${esc(person.name)}${credentialHtml}</div>
<div style="font-family:Arial,Helvetica,sans-serif;font-size:10.5px;line-height:14px;font-weight:600;color:#39779f;margin-top:1px;">${esc(person.title || '')}</div>
<div style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;line-height:12px;font-weight:bold;color:#59666e;letter-spacing:.45px;margin-top:1px;">THE PROCESS RECOVERY CENTER</div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:5px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;"><tr>
<td style="font-size:9px;line-height:13px;font-weight:bold;color:#39779f;padding-right:4px;">P</td>
<td style="font-size:9px;line-height:13px;padding-right:9px;"><a href="${esc(phoneHref)}" style="color:#26343d;text-decoration:none;">${esc(person.phone || '')}</a></td>
<td style="font-size:9px;line-height:13px;font-weight:bold;color:#39779f;padding-right:4px;">F</td>
<td style="font-size:9px;line-height:13px;color:#26343d;">${FAX_DISPLAY}</td>
</tr></table>
<div style="font-size:9px;line-height:13px;margin-top:1px;"><span style="font-weight:bold;color:#39779f;">E</span>&nbsp; <a href="mailto:${esc(person.email || '')}" style="color:#26343d;text-decoration:none;">${esc(person.email || '')}</a></div>
<div style="font-size:9px;line-height:13px;margin-top:1px;"><span style="font-weight:bold;color:#39779f;">W</span>&nbsp; <a href="${esc(website)}" style="color:#39779f;text-decoration:none;">${esc(websiteDisplay)}</a></div>
<div style="font-size:9px;line-height:13px;margin-top:1px;"><span style="font-weight:bold;color:#39779f;">A</span>&nbsp; <a href="${esc(mapLink)}" style="color:#26343d;text-decoration:none;">${esc(location)}</a></div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:5px;border-top:1px solid #cddce5;width:auto;"><tr>
<td style="padding-top:5px;font-family:Georgia,'Times New Roman',serif;font-size:7.5px;font-style:italic;line-height:10px;color:#69767e;vertical-align:middle;white-space:nowrap;">A proud affiliate of</td>
<td style="padding-top:4px;padding-left:2px;vertical-align:middle;"><img src="${KING_LOGO}" width="88" alt="King Healthcare Group" style="display:block;width:88px;height:auto;border:0;"></td>
</tr></table>
</td>
</tr>
</table>`;
}

function render(person){
  document.getElementById('signature').innerHTML = signatureHtml(person);
  document.getElementById('error').hidden = true;
  document.getElementById('copyBtn').disabled = false;
  document.getElementById('status').textContent = '';
}

function updateUrl(staffId){
  const url = new URL(window.location.href);
  url.searchParams.set('staff', staffId);
  history.replaceState({}, '', url);
}

async function loadStaff(){
  const select=document.getElementById('staffSelect');
  const error=document.getElementById('error');
  try{
    const response=await fetch(DATA_URL,{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load staff data.');
    const data=await response.json();
    staffData=Array.isArray(data.staff)?data.staff:[];
    settings=data.settings||{};
    if(!staffData.length) throw new Error('No active staff records were found.');

    select.innerHTML='';
    staffData.forEach(person=>{
      const option=document.createElement('option');
      option.value=person.id;
      option.textContent=person.name + (person.credentials ? ' — '+person.credentials : '');
      select.appendChild(option);
    });

    const requested=new URLSearchParams(window.location.search).get('staff');
    const requestedPerson=staffData.find(p=>String(p.id).toLowerCase()===String(requested||'').toLowerCase());
    const defaultPerson=requestedPerson || staffData.find(p=>String(p.id).toLowerCase()==='kevin') || staffData[0];

    select.value=defaultPerson.id;
    select.disabled=false;
    render(defaultPerson);
    if(requestedPerson) updateUrl(defaultPerson.id);

    select.addEventListener('change',()=>{
      const person=staffData.find(p=>p.id===select.value);
      if(person){render(person);updateUrl(person.id);}
    });
  }catch(err){
    select.innerHTML='<option>Unable to load staff</option>';
    error.textContent='The staff list could not be loaded from the shared Business Card Data feed. Please refresh and try again.';
    error.hidden=false;
  }
}

async function copySignature(){
  const sig=document.getElementById('signature');
  const status=document.getElementById('status');
  if(!sig.innerHTML.trim()) return;
  try{
    const blob=new Blob([sig.innerHTML],{type:'text/html'});
    const text=new Blob([sig.innerText],{type:'text/plain'});
    await navigator.clipboard.write([new ClipboardItem({'text/html':blob,'text/plain':text})]);
    status.textContent='Copied — paste into Gmail.';
  }catch(e){
    const r=document.createRange();r.selectNodeContents(sig);
    const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    document.execCommand('copy');s.removeAllRanges();
    status.textContent='Copied — paste into Gmail.';
  }
}

loadStaff();
</script>
</body>
</html>
